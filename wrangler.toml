name = "govpulse"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# Workers Rate Limiting binding (free; per Cloudflare location, approximate)
[[ratelimits]]
name = "RL_API"
namespace_id = "4201"
  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "RL_EMBED"
namespace_id = "4202"
  [ratelimits.simple]
  limit = 300
  period = 60
