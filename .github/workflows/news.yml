# Free live headlines (Google News RSS, GDELT, official feeds) every 2 hours, then rebuild + deploy.
# news.py keeps the last good data if a source fails or a run returns too little.
name: news-refresh
on:
  schedule: [{ cron: '15 */2 * * *' }]
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: news-refresh, cancel-in-progress: false }
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write  # commit refreshed headlines only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - run: python pipeline/news.py || echo "news fetch failed, keeping last good data"
      - name: Commit headlines if changed
        id: commit
        run: |
          git config user.name govpulse-bot && git config user.email bot@users.noreply.github.com
          git add src/data/news.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else git commit -m "data: news refresh" && git pull --rebase && git push && echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.commit.outputs.changed == 'true'
        with: { node-version: 22, cache: npm }
      - if: steps.commit.outputs.changed == 'true'
        run: npm ci && npm run build
      - uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        if: steps.commit.outputs.changed == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.153.0'  # wrangler 3.x peer-conflicts with @cloudflare/workers-types v5
          command: pages deploy dist --project-name=govpulse --branch=main
