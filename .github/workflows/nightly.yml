# Nightly data refresh + deploy to Cloudflare Pages. NOT ACTIVE until the repo is pushed
# and secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are set.
name: nightly-refresh
on:
  schedule: [{ cron: '30 2 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyarrow && python pipeline/fetch.py
      - name: Commit data if changed
        run: |
          git config user.name govpulse-bot && git config user.email bot@users.noreply.github.com
          git add src/data pipeline/data.parquet && git diff --cached --quiet || git commit -m "data: nightly refresh" && git push
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=govpulse
