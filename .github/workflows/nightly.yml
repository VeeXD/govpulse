# Nightly data refresh + deploy to Cloudflare Pages.
# Requires repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (Settings > Secrets > Actions).
name: nightly-refresh
on:
  schedule: [{ cron: '30 2 * * *' }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commit refreshed data only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - run: pip install pyarrow && python pipeline/fetch.py && python pipeline/export_csv.py && (python pipeline/latest.py || true) && (python pipeline/commodity.py || true) && (python pipeline/deep.py || true)
      - name: Commit data if changed
        run: |
          git config user.name govpulse-bot && git config user.email bot@users.noreply.github.com
          git add src/data pipeline/data.parquet datasets && git diff --cached --quiet || (git commit -m "data: nightly refresh" && git pull --rebase && git push)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.153.0'  # wrangler 3.x peer-conflicts with @cloudflare/workers-types v5
          command: pages deploy dist --project-name=govpulse --branch=main
      - name: Ping IndexNow
        run: python3 pipeline/indexnow.py || true
